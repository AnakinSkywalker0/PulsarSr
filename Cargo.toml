[workspace]
members = ["crates/fbank", "crates/rfi", "crates/dedisperse", "crates/search", "crates/fold", "crates/synth", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
fbank = { path = "crates/fbank" }
rfi = { path = "crates/rfi" }
dedisperse = { path = "crates/dedisperse" }
search = { path = "crates/search" }
fold = { path = "crates/fold" }
synth = { path = "crates/synth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"

[profile.release]
debug = 1
